name: GhostID Intent — Midnight CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Compile Circuits & Run ZK Intent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile Compact Contracts (GhostID Intent Circuits)
        run: npm run compile:contract

      - name: Run Test Suite (Intent Engine, Proof Router, Privacy Receipt, ZK Predicates)
        run: npm test

      - name: Build Next.js Production Application (19 routes including /intent)
        run: npm run build
