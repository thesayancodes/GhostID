<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GhostID — Prove who you are. Reveal nothing you don't need to.">
  <style>
    .bg{fill:#0A0A10;}
    .dot{fill:#23232F;opacity:0.55;}
    .frame{fill:none;stroke:#23232F;stroke-width:1;}
    .tick{stroke:#4A3F7A;stroke-width:1.5;opacity:0.8;}
    .eyebrow{font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:14px;letter-spacing:4px;fill:#8B7FFF;opacity:0.9;}
    .caselabel{font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:11px;letter-spacing:2.5px;fill:#5B5B72;}
    .word{font-family:Arial,'Helvetica Neue',sans-serif;font-weight:800;font-size:76px;letter-spacing:1px;fill:#ECE9E2;}
    .word .g{fill:#8B7FFF;}
    .tagline{font-family:Arial,'Helvetica Neue',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.3px;fill:#ECE9E2;}
    .subline{font-family:'Consolas','SFMono-Regular',Menlo,monospace;font-size:12.5px;letter-spacing:1.3px;fill:#7C7C93;}
    .redact{fill:#000000;transform-box:fill-box;transform-origin:100% 50%;animation:declass 6.5s ease-in-out infinite;}
    @keyframes declass{
      0%{transform:scaleX(1);}
      32%{transform:scaleX(1);}
      52%{transform:scaleX(0);}
      88%{transform:scaleX(0);}
      100%{transform:scaleX(1);}
    }
    .scan{animation:sweep 6s linear infinite;}
    @keyframes sweep{0%{transform:translateX(-140px);}100%{transform:translateX(1200px);}}
    .ring{fill:none;stroke:#8B7FFF;stroke-width:1.1;}
    .ring1{opacity:0.55;animation:breathe 3.4s ease-in-out infinite;}
    .ring2{opacity:0.35;animation:breathe 3.4s ease-in-out infinite 0.7s;}
    .ring3{opacity:0.22;animation:breathe 3.4s ease-in-out infinite 1.4s;}
    @keyframes breathe{0%,100%{opacity:0.18;}50%{opacity:0.6;}}
    .eye{fill:#2EE6A6;animation:blink 5s ease-in-out infinite;}
    @keyframes blink{0%,90%,100%{opacity:1;}94%{opacity:0.05;}}
    .ghost-outline{fill:#8B7FFF;fill-opacity:0.04;stroke:#8B7FFF;stroke-width:1.3;opacity:0.8;}
  </style>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" class="dot"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="280" rx="16"/></clipPath>
    <linearGradient id="scanGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" style="stop-color:#8B7FFF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8B7FFF;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#8B7FFF;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="30%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#15131F"/>
      <stop offset="100%" stop-color="#0A0A10"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="url(#vignette)"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <rect class="scan" x="0" y="0" width="140" height="280" fill="url(#scanGrad)"/>

    <!-- case label -->
    <text x="1144" y="34" text-anchor="end" class="caselabel">CASE FILE // MIDNIGHT-NETWORK</text>

    <!-- left content -->
    <text x="56" y="52" class="eyebrow">ZERO&#8209;KNOWLEDGE IDENTITY</text>
    <text x="54" y="150" class="word">GHOST<tspan class="g">ID</tspan></text>

    <rect x="55" y="168" width="600" height="26" class="redact"/>
    <text x="56" y="187" class="tagline" textLength="598" lengthAdjust="spacingAndGlyphs">PROVE WHO YOU ARE. REVEAL NOTHING YOU DON'T NEED TO.</text>

    <text x="56" y="220" class="subline" textLength="520" lengthAdjust="spacingAndGlyphs">COMPACT CIRCUITS · SELECTIVE DISCLOSURE · RISE IN BUILDER CHALLENGE</text>

    <!-- right: ghost / fingerprint hologram -->
    <g transform="translate(1010,150)">
      <circle r="46" class="ring ring1"/>
      <circle r="66" class="ring ring2"/>
      <circle r="86" class="ring ring3"/>
      <path class="ghost-outline" d="M -78,10 C -78,-56 -40,-92 0,-92 C 40,-92 78,-56 78,10 L 78,64 L 58,48 L 38,64 L 18,48 L -2,64 L -22,48 L -42,64 L -62,48 L -78,64 Z"/>
      <circle cx="-24" cy="-8" r="6.5" class="eye"/>
      <circle cx="26" cy="-8" r="6.5" class="eye" style="animation-delay:0.3s"/>
    </g>

    <rect class="frame" x="1" y="1" width="1198" height="278" rx="16"/>
    <path class="tick" d="M18,2 L2,2 L2,18"/>
    <path class="tick" d="M1182,2 L1198,2 L1198,18"/>
    <path class="tick" d="M18,278 L2,278 L2,262"/>
    <path class="tick" d="M1182,278 L1198,278 L1198,262"/>
  </g>
</svg>
